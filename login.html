

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login — UMBRELLAedible</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#080808;color:#fff}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[440px] bg-[#111] border border-white/10 rounded-[32px] p-8">
<div class="w-12 h-12 rounded-full bg-[#FFD27A] text-black flex items-center justify-center mx-auto"><i class="fa-solid fa-utensils"></i></div>
<h1 class="mt-5 text-center font-black text-[22px]">Member Login</h1>
<p class="mt-2 text-center text-[11px] text-white/40">Enter your registered email — system checks Firebase first</p>

<div class="mt-8 space-y-3">
<input id="email" type="email" placeholder="Registered email — added by founder" class="w-full h-[48px] px-5 rounded-full bg-[#0a0a0a] border border-white/10 outline-none text-[13px]"/>

<p id="error" class="hidden text-[12px] text-red-400 bg-red-500/10 border border-red-500/20 rounded-[14px] p-3"></p>
<p id="success" class="hidden text-[12px] text-green-400 bg-green-500/10 border border-green-500/20 rounded-[14px] p-3"></p>

<button onclick="login()" id="loginBtn" class="w-full h-[48px] rounded-full bg-white text-black font-black text-[13px] flex items-center justify-center gap-2"><i class="fa-solid fa-utensils"></i> Check & Login</button>

<p class="text-center text-[10px] text-white/20">No password needed — verified by Firebase<br>Only approved chefs can login. Ask founder to approve you.</p>
<div class="pt-4 border-t border-white/10 text-center">
<p class="text-[11px] text-white/30">Not a chef yet? <a href="./become-chef.html" class="text-[#FFD27A] font-bold">Apply to become chef</a></p>
</div>
</div>
</div>

<script>
var firebaseConfig = { apiKey: "AIzaSyBNNodl0fWwQm42KAublAcSuFO3RQ8fwOE", authDomain: "umbrellaedible.firebaseapp.com", projectId: "umbrellaedible", storageBucket: "umbrellaedible.firebasestorage.app", messagingSenderId: "705948520770", appId: "1:705948520770:web:30d2080cb4191b2881b8db" };
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

function showError(m){ document.getElementById('error').textContent=m; document.getElementById('error').classList.remove('hidden'); document.getElementById('success').classList.add('hidden'); }
function showSuccess(m){ document.getElementById('success').textContent=m; document.getElementById('success').classList.remove('hidden'); document.getElementById('error').classList.add('hidden'); }

function login(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  if(!email){ showError('Enter your registered email'); return; }
  if(!email.includes('@')){ showError('Enter valid email'); return; }

  document.getElementById('loginBtn').innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Checking Firebase...';

  // SAME CHECK AS FOUNDER - CHECK FIREBASE FIRST
  db.collection('chef_applications').where('email','==',email).get().then(function(snap){
    if(snap.empty){
      showError('❌ Email not found in chef database.\nFounder must add you first in Admin Panel > Add Chef');
      document.getElementById('loginBtn').innerHTML='<i class="fa-solid fa-utensils"></i> Check & Login';
      return;
    }
    var d=snap.docs[0].data();
    var id=snap.docs[0].id;

    if(d.banned || d.status==='banned'){
      showError('🚫 Banned: '+(d.banReason||'Contact founder'));
      document.getElementById('loginBtn').innerHTML='<i class="fa-solid fa-utensils"></i> Check & Login';
      return;
    }
    if(d.status==='pending'){
      showError('⏳ Your application is pending review. Wait for founder approval.');
      document.getElementById('loginBtn').innerHTML='<i class="fa-solid fa-utensils"></i> Check & Login';
      return;
    }
    if(d.status==='rejected'){
      showError('❌ Application rejected: '+(d.rejectionReason||'Contact founder'));
      document.getElementById('loginBtn').innerHTML='<i class="fa-solid fa-utensils"></i> Check & Login';
      return;
    }
    if(d.status!=='approved'){
      showError('Status is '+d.status+'. Need founder approval.');
      document.getElementById('loginBtn').innerHTML='<i class="fa-solid fa-utensils"></i> Check & Login';
      return;
    }

    // SUCCESS - Same as founder login
    localStorage.setItem('umbrella_member_email', email);
    localStorage.setItem('umbrella_member_id', id);
    localStorage.setItem('umbrella_member_name', d.name||email);
    localStorage.setItem('umbrella_member_role', d.role||d.level||'Chef');
    localStorage.setItem('umbrella_member_photo', d.photoUrl||'');
    localStorage.setItem('umbrella_member_login_time', Date.now().toString());

    showSuccess('✅ Chef verified from Firebase! Redirecting to panel...');
    setTimeout(function(){
      window.location.href='https://umbrellaedible-2ln.pages.dev/member-panel.html';
    }, 800);
  }).catch(function(e){
    showError('Firebase error: '+e.message);
    document.getElementById('loginBtn').innerHTML='<i class="fa-solid fa-utensils"></i> Check & Login';
  });
}
</script>
</body>
</html>
