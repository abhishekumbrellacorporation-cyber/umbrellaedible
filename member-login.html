

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login — UMBRELLAedible</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body style="font-family:'Plus Jakarta Sans',sans-serif;background:#080808;color:#fff" class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[440px] bg-[#111] border border-white/10 rounded-[32px] p-8">
<div class="w-12 h-12 rounded-full bg-[#FFD27A] text-black flex items-center justify-center mx-auto"><i class="fa-solid fa-utensils"></i></div>
<h1 class="mt-5 text-center font-black text-[22px]">Member Login</h1>
<p class="mt-2 text-center text-[11px] text-white/40">Only chefs added/approved by founder can login</p>
<div class="mt-8 space-y-3">
<input id="email" type="email" placeholder="Registered email" class="w-full h-[48px] px-5 rounded-full bg-[#0a0a0a] border border-white/10 outline-none text-[13px]"/>
<input id="password" type="password" placeholder="Password" class="w-full h-[48px] px-5 rounded-full bg-[#0a0a0a] border border-white/10 outline-none text-[13px]"/>
<p id="error" class="hidden text-[12px] text-red-400 bg-red-500/10 border border-red-500/20 rounded-[14px] p-3"></p>
<p id="success" class="hidden text-[12px] text-green-400 bg-green-500/10 border border-green-500/20 rounded-[14px] p-3"></p>
<button onclick="login()" id="loginBtn" class="w-full h-[48px] rounded-full bg-white text-black font-black text-[13px]">Login</button>
<button onclick="sendReset()" class="w-full text-[11px] text-white/30">Forgot password? Send reset link</button>
</div>
</div>
<script>
var firebaseConfig = { apiKey: "AIzaSyBNNodl0fWwQm42KAublAcSuFO3RQ8fwOE", authDomain: "umbrellaedible.firebaseapp.com", projectId: "umbrellaedible", storageBucket: "umbrellaedible.firebasestorage.app", messagingSenderId: "705948520770", appId: "1:705948520770:web:30d2080cb4191b2881b8db" };
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(), db=firebase.firestore();
function showError(m){ document.getElementById('error').textContent=m; document.getElementById('error').classList.remove('hidden'); document.getElementById('success').classList.add('hidden'); }
function showSuccess(m){ document.getElementById('success').textContent=m; document.getElementById('success').classList.remove('hidden'); document.getElementById('error').classList.add('hidden'); }
function login(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  var pass=document.getElementById('password').value;
  if(!email||!pass){ showError('Enter email & password'); return; }
  db.collection('chef_applications').where('email','==',email).get().then(function(snap){
    if(snap.empty){ showError('Email not found in chef database. Founder must add you first in admin panel.'); return; }
    var d=snap.docs[0].data();
    if(d.banned||d.status==='banned'){ showError('Banned: '+(d.banReason||'')); return; }
    if(d.status!=='approved'){ showError('Your application is '+d.status+'. Wait for founder approval.'); return; }
    document.getElementById('loginBtn').innerText='Checking...';
    auth.signInWithEmailAndPassword(email,pass).then(function(){ window.location.href='./member-panel.html'; }).catch(function(e){ showError(e.message); document.getElementById('loginBtn').innerText='Login'; });
  });
}
function sendReset(){
  var email=document.getElementById('email').value.trim().toLowerCase();
  if(!email){ showError('Enter email'); return; }
  db.collection('chef_applications').where('email','==',email).get().then(function(snap){
    if(snap.empty){ showError('Not in database'); return; }
    auth.sendPasswordResetEmail(email).then(function(){ showSuccess('Reset link sent to '+email); }).catch(function(e){ showError(e.message); });
  });
}
</script>
</body></html>
