<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Chefs — Verified Members | UMBRELLAedible</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#FFF9F0}
h1,h2{font-family:'Fraunces',serif}
@keyframes glowFounder {0%{box-shadow:0 0 0 0 rgba(255,122,26,0.5)}50%{box-shadow:0 0 0 8px rgba(255,122,26,0.12)}100%{box-shadow:0 0 0 0 rgba(255,122,26,0.5)}}
@keyframes glowCoFounder {0%{box-shadow:0 0 0 0 rgba(124,58,237,0.5)}50%{box-shadow:0 0 0 8px rgba(124,58,237,0.12)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0.5)}}
.founder-card{animation:glowFounder 3s infinite; background:linear-gradient(white,white) padding-box, linear-gradient(135deg,#FF7A1A,#FFD27A,#FF7A1A) border-box; border:2px solid transparent}
.cofounder-card{animation:glowCoFounder 3s infinite; background:linear-gradient(white,white) padding-box, linear-gradient(135deg,#7C3AED,#A855F7,#7C3AED) border-box; border:2px solid transparent}
.chef-card:hover{transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.1)}
.chef-card{transition:all 0.3s cubic-bezier(0.16,1,0.3,1)}
.badge-founder{background:linear-gradient(135deg,#111,#333); color:#FFD27A; border:1px solid #FFD27A}
.badge-cofounder{background:linear-gradient(135deg,#7C3AED,#A855F7); color:white}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="antialiased text-[#111]">
<header class="sticky top-0 z-50 bg-[#FFF9F0]/90 backdrop-blur-xl border-b border-black/10">
<div class="max-w-[1220px] mx-auto px-4 md:px-6 h-[64px] flex items-center justify-between">
<a href="https://umbrellaedible.blogspot.com" class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-black text-white flex items-center justify-center"><i class="fa-solid fa-utensils text-[12px]"></i></div><span class="font-black text-[20px]" style="font-family:Fraunces">UMBRELLAedible</span><span class="ml-2 px-2.5 py-1 rounded-full bg-[#111] text-white text-[9px] font-bold tracking-widest">VERIFIED</span></a>
<a href="https://umbrellaedible-2ln.pages.dev/membership.html" class="h-9 px-5 rounded-full bg-[#111] text-white flex items-center gap-2 text-[13px] font-bold"><i class="fa-solid fa-crown text-[#FFD27A]"></i> Become a Chef</a>
</div>
</header>

<section class="max-w-[1220px] mx-auto px-4 md:px-6 pt-10 pb-6">
<h1 class="text-[48px] md:text-[62px] font-black leading-[0.85]">Meet our<br><span class="text-[#FF7A1A]">Verified Chefs.</span></h1>
<div class="mt-6 flex gap-3"><div class="bg-white border rounded-[16px] px-4 py-3"><p class="text-[10px] font-black opacity-40 tracking-widest">TOTAL</p><p id="totalCount" class="font-black text-[18px]">0</p></div><div class="bg-[#111] text-white rounded-[16px] px-4 py-3"><p class="text-[10px] font-black text-white/50 tracking-widest">FOUNDERS</p><p id="founderCount" class="font-black text-[18px]">0</p></div></div>
<div class="mt-6 flex gap-2"><input id="search" placeholder="Search..." class="flex-1 h-[46px] px-5 rounded-full bg-white border border-black/10 outline-none text-[13px]"/><select id="filterLevel" class="h-[46px] px-5 rounded-full bg-white border border-black/10 font-bold text-[13px]"><option value="">All</option><option value="founder">Founder Only</option><option value="cofounder">Co-Founder Only</option><option value="vip">VIP</option></select></div>
</section>

<section class="max-w-[1220px] mx-auto px-4 md:px-6 pb-24">
<!-- FOUNDER SECTION - NOW SAME GRID AS OTHERS -->
<div id="founderSection" class="hidden mb-10">
<div class="flex items-center gap-3 mb-6"><div class="h-[1px] flex-1 bg-black/10"></div><span class="px-4 py-1.5 rounded-full bg-black text-white text-[10px] font-black tracking-[0.15em]">FOUNDER CIRCLE</span><div class="h-[1px] flex-1 bg-black/10"></div></div>
<div id="founderGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</div>

<div id="coFounderSection" class="hidden mb-10">
<div class="flex items-center gap-3 mb-6"><div class="h-[1px] flex-1 bg-purple-200"></div><span class="px-4 py-1.5 rounded-full bg-[#7C3AED] text-white text-[10px] font-black tracking-[0.15em]">CO-FOUNDER CIRCLE</span><div class="h-[1px] flex-1 bg-purple-200"></div></div>
<div id="coFounderGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</div>

<div id="loading" class="py-16 text-center"><div class="w-10 h-10 border-4 border-black/10 border-t-black rounded-full animate-spin mx-auto"></div></div>
<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 hidden"></div>
<div id="empty" class="hidden py-16 text-center bg-white border rounded-[24px]"><h3 class="font-black">No chefs found</h3></div>
</section>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBNNodl0fWwQm42KAublAcSuFO3RQ8fwOE",
  authDomain: "umbrellaedible.firebaseapp.com",
  projectId: "umbrellaedible",
  storageBucket: "umbrellaedible.firebasestorage.app",
  messagingSenderId: "705948520770",
  appId: "1:705948520770:web:30d2080cb4191b2881b8db"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var allChefs=[];

function getFounderType(c){
  var raw = (c.role||c.founderRole||c.designation||c.founderType||c.level||c.vipBadge||'').toString().toLowerCase();
  if(c.isFounder===true || c.role==='Founder' || raw.includes('founder') &&!raw.includes('co-founder') &&!raw.includes('co founder') &&!raw.includes('cofounder')) {
     if(raw.includes('co')) return 'cofounder';
     return 'founder';
  }
  if(raw.includes('co-founder') || raw.includes('co founder') || raw.includes('cofounder') || raw==='co-founder' || c.role==='Co-Founder' || c.founderRole==='Co-Founder') return 'cofounder';
  if(c.level==='Founder Team'){
    if((c.vipBadge||'').toLowerCase().includes('co')) return 'cofounder';
    if((c.name||'').toLowerCase().includes('abhishek')) return 'founder';
    return 'cofounder';
  }
  return 'normal';
}

// SAME SIZE AS NORMAL - ONLY BADGE & BORDER DIFFERENT
function cardFounder(c, type){
  var photo=c.photoUrl||'https://ui-avatars.com/api/?name='+encodeURIComponent(c.name)+'&background=111&color=fff';
  var isFounder = type==='founder';
  var badgeClass = isFounder? 'badge-founder' : 'badge-cofounder';
  var tagText = isFounder? 'FOUNDER' : 'CO-FOUNDER';
  var tagIcon = isFounder? 'fa-crown' : 'fa-handshake';
  var cardClass = isFounder? 'founder-card' : 'cofounder-card';

  return `<div class="${cardClass} chef-card rounded-[24px] p-5 flex gap-4 items-center">
    <div class="relative shrink-0">
      <img src="${photo}" class="w-[64px] h-[64px] rounded-full object-cover border-2 ${isFounder?'border-[#FFD27A]':'border-[#A855F7]'}"/>
      <span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full ${isFounder?'bg-black text-[#FFD27A]':'bg-[#7C3AED] text-white'} border-2 border-white flex items-center justify-center text-[8px]"><i class="fa-solid fa-check"></i></span>
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex gap-1.5 flex-wrap">
        <span class="px-2 py-0.5 rounded-full text-[8px] font-black tracking-widest ${badgeClass}"><i class="fa-solid ${tagIcon} mr-1"></i>${tagText}</span>
        <span class="px-2 py-0.5 rounded-full bg-black text-white text-[8px] font-black"><i class="fa-solid fa-badge-check text-[#FFD27A] mr-1"></i>VERIFIED</span>
      </div>
      <h3 class="mt-1.5 font-black text-[14px] leading-tight truncate">${c.name||'Chef'} <i class="fa-solid fa-circle-check text-[#1DA1F2] text-[11px]"></i></h3>
      <p class="text-[10px] font-bold text-black/50 truncate">${c.speciality||'Founder'} ${c.location?'• '+c.location:''}</p>
      <div class="mt-2 flex gap-1.5">
        <a href="${c.instagram||'#'}" target="_blank" class="flex-1 h-8 rounded-full bg-[#F6F1E9] border border-black/10 text-[10px] font-bold flex items-center justify-center gap-1"><i class="fa-brands fa-instagram"></i> Insta</a>
        <a href="https://umbrellaedible.blogspot.com/search?q=${encodeURIComponent(c.name||'')}" class="flex-1 h-8 rounded-full bg-[#111] text-white text-[10px] font-bold flex items-center justify-center">Recipes</a>
      </div>
    </div>
  </div>`;
}

function cardNormal(c){
  var photo=c.photoUrl||'https://ui-avatars.com/api/?name='+encodeURIComponent(c.name)+'&background=111&color=fff';
  var isVIP=c.isVIP===true;
  return `<div class="chef-card bg-white border ${isVIP?'border-purple-200':'border-black/10'} rounded-[24px] p-5 flex gap-4 items-center">
    <div class="relative shrink-0">
      <img src="${photo}" class="w-[64px] h-[64px] rounded-full object-cover border-2 ${isVIP?'border-purple-300':'border-black/10'}"/>
      <span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-black text-white border-2 border-white flex items-center justify-center text-[8px]"><i class="fa-solid fa-check"></i></span>
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex gap-1.5 flex-wrap"><span class="px-2 py-0.5 rounded-full bg-black text-white text-[8px] font-black tracking-widest">VERIFIED</span>${isVIP?`<span class="px-2 py-0.5 rounded-full bg-[#7C3AED] text-white text-[8px] font-black">${c.vipBadge||'VIP'}</span>`:''}<span class="px-2 py-0.5 rounded-full bg-[#F6F1E9] text-[8px] font-bold">${c.level||''}</span></div>
      <h3 class="mt-1.5 font-black text-[14px] leading-tight truncate">${c.name||'Chef'} <i class="fa-solid fa-circle-check text-[#1DA1F2] text-[11px]"></i></h3>
      <p class="text-[10px] font-bold text-black/50 truncate">${c.speciality||''} ${c.location?'• '+c.location:''}</p>
      <div class="mt-2 flex gap-1.5"><a href="${c.instagram||'#'}" target="_blank" class="flex-1 h-8 rounded-full bg-white border border-black/10 text-[10px] font-bold flex items-center justify-center gap-1"><i class="fa-brands fa-instagram"></i> Insta</a><a href="https://umbrellaedible.blogspot.com/search?q=${encodeURIComponent(c.name||'')}" class="flex-1 h-8 rounded-full bg-[#111] text-white text-[10px] font-bold flex items-center justify-center">Recipes</a></div>
    </div>
  </div>`;
}

function render(list){
 var grid=document.getElementById('grid');
 var fGrid=document.getElementById('founderGrid');
 var cfGrid=document.getElementById('coFounderGrid');
 var fSec=document.getElementById('founderSection');
 var cfSec=document.getElementById('coFounderSection');

 var founders=list.filter(c=>getFounderType(c)==='founder');
 var cofounders=list.filter(c=>getFounderType(c)==='cofounder');
 var others=list.filter(c=>getFounderType(c)==='normal');

 if(founders.length){fSec.classList.remove('hidden'); fGrid.innerHTML=founders.map(c=>cardFounder(c,'founder')).join('');} else fSec.classList.add('hidden');
 if(cofounders.length){cfSec.classList.remove('hidden'); cfGrid.innerHTML=cofounders.map(c=>cardFounder(c,'cofounder')).join('');} else cfSec.classList.add('hidden');

 if(others.length){grid.innerHTML=others.map(cardNormal).join(''); grid.classList.remove('hidden');} else {grid.classList.add('hidden'); if(!founders.length &&!cofounders.length) document.getElementById('empty').classList.remove('hidden');}
 document.getElementById('loading').classList.add('hidden');
 document.getElementById('totalCount').textContent=list.length;
 document.getElementById('founderCount').textContent=founders.length+cofounders.length;
}

db.collection('chef_applications').where('status','==','approved').onSnapshot(function(snap){
 var list=[]; snap.forEach(function(doc){var d=doc.data(); d.id=doc.id; if(d.banned) return; list.push(d);});
 list.sort((a,b)=>{
   var order={founder:0, cofounder:1, normal:2};
   var ta=getFounderType(a), tb=getFounderType(b);
   if(order[ta]!==order[tb]) return order[ta]-order[tb];
   return (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0);
 });
 allChefs=list; render(list);
});

function applyFilters(){
 var q=(document.getElementById('search').value||'').toLowerCase();
 var lvl=document.getElementById('filterLevel').value;
 var filtered=allChefs.filter(function(c){
  var type=getFounderType(c);
  var mSearch=!q||(c.name||'').toLowerCase().includes(q)||(c.location||'').toLowerCase().includes(q)||(c.speciality||'').toLowerCase().includes(q);
  var mLevel=true;
  if(lvl==='founder') mLevel=type==='founder';
  else if(lvl==='cofounder') mLevel=type==='cofounder';
  else if(lvl==='vip') mLevel=c.isVIP;
  return mSearch&&mLevel;
 });
 render(filtered);
}
document.getElementById('search').addEventListener('input',applyFilters);
document.getElementById('filterLevel').addEventListener('change',applyFilters);
</script>

<div class='footer wrap' style="text-align:center; width:100%; display:flex; justify-content:center; align-items:center; padding:24px 0; font-size:11px; color:#666;">
  Founded by <span style="color:#FF6A00; font-weight:800; margin:0 4px;">Abhishek Ganguly</span> - UMBRELLAedible 2026
</div>
</body>
</html>
